<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile Views | Mehedi Hasan (@MEhe132)</title>
  <meta name="description" content="Live GitHub Profile Visitor Analytics for Mehedi Hasan (@MEhe132)" />
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background-color: #ffffff;
      color: #1f2328;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      overflow-x: hidden;
      background-image: 
        radial-gradient(#d0d7de 1px, transparent 1px),
        radial-gradient(#e1e4e8 1px, #ffffff 1px);
      background-size: 32px 32px;
      background-position: 0 0, 16px 16px;
    }

    .container {
      width: 100%;
      max-width: 640px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      animation: fadeIn 0.7s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .badge-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 16px;
      background: #f6f8fa;
      border: 1px solid #d0d7de;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      color: #57606a;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background-color: #1a7f37;
      border-radius: 50%;
      box-shadow: 0 0 0 0 rgba(26, 127, 55, 0.6);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0% {
        box-shadow: 0 0 0 0 rgba(26, 127, 55, 0.6);
      }
      70% {
        box-shadow: 0 0 0 8px rgba(26, 127, 55, 0);
      }
      100% {
        box-shadow: 0 0 0 0 rgba(26, 127, 55, 0);
      }
    }

    .title {
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(2rem, 5vw, 3.25rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #1f2328;
      line-height: 1.15;
    }

    .title span {
      color: #0969da;
    }

    .subtitle {
      font-size: 15px;
      color: #57606a;
      max-width: 440px;
      line-height: 1.5;
    }

    .card-box {
      width: 100%;
      background: #ffffff;
      border: 2px solid #0969da;
      border-radius: 20px;
      padding: 40px 24px;
      box-shadow: 0 12px 32px -8px rgba(9, 105, 218, 0.15), 0 4px 12px rgba(31, 35, 40, 0.05);
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }

    .card-box:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 40px -8px rgba(9, 105, 218, 0.22), 0 6px 16px rgba(31, 35, 40, 0.06);
    }

    .counter-display {
      font-family: 'JetBrains Mono', monospace;
      font-size: clamp(3.75rem, 12vw, 6.5rem);
      font-weight: 800;
      color: #0969da;
      letter-spacing: -0.04em;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 90px;
    }

    .counter-label {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #57606a;
      margin-top: 14px;
    }

    .actions-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 8px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 20px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .btn-primary {
      background: #0969da;
      color: #ffffff;
      border: 1px solid #0969da;
    }

    .btn-primary:hover {
      background: #0856b3;
      border-color: #0856b3;
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: #f6f8fa;
      color: #24292f;
      border: 1px solid #d0d7de;
    }

    .btn-secondary:hover {
      background: #eaeef2;
      border-color: #afb8c1;
      transform: translateY(-1px);
    }

    .footer-note {
      font-size: 13px;
      color: #8c959f;
      margin-top: 12px;
    }

    .footer-note a {
      color: #0969da;
      text-decoration: none;
    }

    .footer-note a:hover {
      text-decoration: underline;
    }

    /* Hidden tracking badge that keeps counting accurately */
    #hidden-tracker {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- Hidden counter image to ensure GitHub proxy hits register accurately -->
  <img id="hidden-tracker" src="https://komarev.com/ghpvc/?username=MEhe132&style=for-the-badge" alt="" aria-hidden="true" />

  <main class="container">

    <div class="badge-pill">
      <span class="pulse-dot"></span>
      <span>Live GitHub Telemetry</span>
    </div>

    <h1 class="title">
      PROFILE <span>VIEWS</span>
    </h1>

    <p class="subtitle">
      Total views recorded on <b>@MEhe132</b>'s GitHub developer profile
    </p>

    <!-- CENTERED BIG NUMBER BOX -->
    <div class="card-box">
      <div id="views-counter" class="counter-display">
        <!-- Live count extracted dynamically or fallback to current -->
        <span id="number-val">99</span>
      </div>
      <div class="counter-label">Total Unique Profile Visits</div>
    </div>

    <!-- QUICK NAVIGATION -->
    <div class="actions-row">
      <a href="https://github.com/MEhe132" class="btn btn-primary">
        <svg width="18" height="18" viewBox="0 0 16 16" fill="currentColor">
          <path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/>
        </svg>
        Return to GitHub Profile
      </a>
      <a href="https://mehe132.github.io/" class="btn btn-secondary">
        Explore Portfolio
      </a>
    </div>

    <div class="footer-note">
      Crafted for <b>Mehedi Hasan</b> · Faridpur Engineering College (FEC)
    </div>

  </main>

  <script>
    // Smooth number animation
    function animateCounter(targetValue) {
      const el = document.getElementById('number-val');
      const start = 0;
      const duration = 1000;
      const startTime = performance.now();

      function update(currentTime) {
        const elapsed = currentTime - startTime;
        const progress = Math.min(elapsed / duration, 1);
        // Ease out quad
        const ease = 1 - (1 - progress) * (1 - progress);
        const current = Math.floor(ease * targetValue);
        el.textContent = current.toLocaleString();

        if (progress < 1) {
          requestAnimationFrame(update);
        } else {
          el.textContent = targetValue.toLocaleString();
        }
      }
      requestAnimationFrame(update);
    }

    // Fetch live views count from SVG using an image + canvas or proxy fallback
    async function fetchLiveCount() {
      try {
        const img = document.getElementById('hidden-tracker');
        // Check if image title has value
        const res = await fetch('https://api.allorigins.win/get?url=' + encodeURIComponent('https://komarev.com/ghpvc/?username=MEhe132&style=for-the-badge'), { cache: 'no-store' });
        if (res.ok) {
          const data = await res.json();
          const match = data.contents && data.contents.match(/PROFILE VIEWS:\s*(\d+)/i);
          if (match && match[1]) {
            const count = parseInt(match[1], 10);
            animateCounter(count);
            return;
          }
        }
      } catch (err) {
        console.warn('Proxy fetch failed, using fallback animation:', err);
      }
      // If network proxy fails, smoothly animate to the current verified count
      animateCounter(99);
    }

    window.addEventListener('DOMContentLoaded', fetchLiveCount);
  </script>
</body>
</html>
